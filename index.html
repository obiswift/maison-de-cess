<!-- Three.js Interactive Canvas & Dynamic Data Connection Script -->
  <script>
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('bg-canvas'), alpha: true, antialias: true });
    
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);

    const ambientLight = new THREE.AmbientLight(0xfff0f3, 1.2);
    scene.add(ambientLight);

    const pointLight = new THREE.PointLight(0xffb6c1, 1.5);
    pointLight.position.set(15, 15, 15);
    scene.add(pointLight);

    // Floating background shapes
    const geometryList = [
      new THREE.IcosahedronGeometry(1.2, 0),
      new THREE.TorusGeometry(1, 0.4, 16, 50),
      new THREE.OctahedronGeometry(1.4, 0),
      new THREE.BoxGeometry(1.2, 1.2, 1.2),
      new THREE.TetrahedronGeometry(1.3, 0)
    ];

    const materials = [
      new THREE.MeshStandardMaterial({ color: 0xffb6c1, roughness: 0.3, metalness: 0.2 }),
      new THREE.MeshStandardMaterial({ color: 0xe8b4b8, roughness: 0.4, metalness: 0.1 }),
      new THREE.MeshStandardMaterial({ color: 0xf5d3da, roughness: 0.2, metalness: 0.4 }),
      new THREE.MeshStandardMaterial({ color: 0xd47a8f, roughness: 0.2, metalness: 0.3 })
    ];

    const meshes = [];
    const count = 35; // Spread 35 objects across the full viewport
    for (let i = 0; i < count; i++) {
      const geom = geometryList[Math.floor(Math.random() * geometryList.length)];
      const mat = materials[Math.floor(Math.random() * materials.length)];
      const mesh = new THREE.Mesh(geom, mat);

      const spreadX = window.innerWidth > 900 ? 70 : 40;
      const spreadY = window.innerHeight > 600 ? 50 : 30;

      mesh.position.x = (Math.random() - 0.5) * spreadX;
      mesh.position.y = (Math.random() - 0.5) * spreadY;
      mesh.position.z = (Math.random() - 0.5) * 40 - 10;

      mesh.rotation.x = Math.random() * Math.PI;
      mesh.rotation.y = Math.random() * Math.PI;

      scene.add(mesh);
      meshes.push({ 
        mesh, 
        speedX: (Math.random() - 0.5) * 0.0015, // Slowed down rotation speed X
        speedY: (Math.random() - 0.5) * 0.0015, // Slowed down rotation speed Y
        floatSpeed: Math.random() * 0.005 + 0.001, // Slower gentle floating wave
        initialY: mesh.position.y
      });
    }

    camera.position.z = 15;

    let mouseX = 0, mouseY = 0;
    document.addEventListener('mousemove', (e) => {
      mouseX = (e.clientX / window.innerWidth - 0.5) * 0.2; // Subtle mouse parallax
      mouseY = (e.clientY / window.innerHeight - 0.5) * 0.2;
    });

    let clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const elapsedTime = clock.getElapsedTime();

      // Animate floating background shapes smoothly and slowly
      meshes.forEach((item, index) => {
        item.mesh.rotation.x += item.speedX;
        item.mesh.rotation.y += item.speedY;
        item.mesh.position.y = item.initialY + Math.sin(elapsedTime * item.floatSpeed + index) * 1.2;
      });

      camera.position.x += (mouseX * 2 - camera.position.x) * 0.03;
      camera.position.y += (-mouseY * 2 - camera.position.y) * 0.03;
      camera.lookAt(scene.position);
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
